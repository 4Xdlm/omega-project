ée à compter les battements de son cœur, trop rapide, trop fort.\n\nArrivée au pied de la tour, elle s'arrête. La porte est entrouverte. Juste une fissure de deux doigts. Une ombre noire se dessine à l'intérieur, là où la lumière du jour devrait pénétrer. Léna pose sa main sur la poignée en fer. Elle est glaciale, rugueuse. Elle pousse. La porte s'ouvre avec un grincement prolongé, une plainte de métal qui résonne dans l'espace confiné de l'entrée.\n\nL'odeur arrive avant qu'elle ne franchisse le seuil. Une odeur lourde, sucrée, métallique. Celle du sang séché, mais aussi celle de la fumée de tabac froid et de la cire de chandelle.\n\nLéna franchit la porte. Elle s'engouffre dans l'escalier en colimaçon, étroit, sombre. Elle monte,\n\nL'escalier en colimaçon semble ne pas vouloir la laisser passer. Les marches de pierre, usées par des siècles de pas, sont glissantes sous ses bottes, recouvertes d'une fine couche de poussière grasse qui s'accroche à la semelle. Léna s'arrête, le souffle court, ses poumons se remplissant de l'air vicié de l'étroit conduit. Elle ne regarde pas en bas. Regarder en bas, c'est voir le vide, c'est sentir le vertige, c'est accepter que la tour est une grotte verticale, une mâchoire de roche qui l'avale. Elle avance, une main sur le mur de pierre, l'autre tendue devant elle pour chasser l'obscurité qui se dégage du sol.\n\nL'odeur est plus forte ici. Elle s'insinue dans les narines, lourde, visqueuse. Le mélange du sang séché et de la fumée de tabac froid est devenu une présence physique, une brume épaisse qui colle à la langue et au palais. Léna retient son souffle, mais cela ne sert à rien ; l'air est saturé, saturé de cette odeur de mort qui ne vient pas seulement du corps, mais de la matière elle-même. Les murs semblent suinter cette odeur. Elle monte, un pas, deux pas, trois. Le silence n'est pas total. Il y a le bruit de sa propre respiration, sifflante, rapide, et le crissement de ses chaussures sur la pierre. Un bruit trop fort, trop net, qui résonne dans le cylindre de pierre comme un coup de marteau.\n\nElle atteint le premier palier. C'est une petite plateforme circulaire, à peine assez large pour faire demi-tour. Une fenêtre, haute et étroite, laisse passer un rayon de lumière grise qui coupe l'obscurité en deux. La poussière danse dans ce faisceau, des millions de particules suspendues dans l'air immobile. Léna s'approche de la fenêtre. La vitre est sale, tachée de traces de doigts et de sel. Elle essuie la vitre avec le revers de sa manche, révélant une vue sur le port. La mer est calme, d'un gris plomb, battant doucement contre les pieux. Les bateaux sont là, immobiles, comme des jouets abandonnés. Personne ne bouge. Le village semble endormi, ou mort. Le silence du port est celui d'un cimetière, un silence lourd, étouffé, qui contraste violemment avec le bourdonnement de son propre sang dans ses oreilles.\n\nElle se détourne de la fenêtre et continue à monter. Le deuxième palier. La porte est là, juste devant elle. Une porte en bois massif, sombre, renforcée par des bandes de fer rouillé. Elle est fermée à clé. La serrure est une vieille ferrure à pêne, rouillée, qui a résisté au temps et au sel. Léna pose sa main sur le bois. Il est froid, humide. Elle sent les nervures du bois, les nœuds, la texture rugueuse. Elle pousse la porte. Elle ne bouge pas. Elle est verrouillée de l'intérieur, ou coincée par le poids du temps. Léna se penche, écoutant. Rien. Juste le bruit de sa respiration et le crissement de la pierre sous ses pieds.\n\nElle recule, le dos contre le mur de pierre. Elle ferme les yeux un instant. Elle pense à la maison. À la petite cuisine, aux carreaux de ciment blanc, au pot de café qui fume sur le poêle. À la radio qui diffuse des nouvelles ennuyeuses, à la voix de sa mère qui lui demande de ramasser le linge. À la routine. À la sécurité du quotidien. Ici, tout est faux. L'air est trop épais, la lumière trop faible, les ombres trop profondes. Elle ouvre les yeux. Elle doit entrer.\n\nElle fouille dans sa poche, sort son couteau suisse. Le métal est froid, luisant.\n\nLe métal est froid, luisant. Elle l'ouvre à la hâte, le cliquetis de la lame qui s'étend sonne comme un éclat de verre dans le silence étouffant. Le manche de bois, usé par l'usage, s'adapte parfaitement à la paume moite de Léna. Elle ne lève pas le bras. Elle n'a pas besoin de force brute, seulement de précision. Elle insère la pointe de la lame dans la fente du verrou, là où le bois a noirci sous l'effet de l'humidité et de la poussière accumulée durant des décennies. Elle pousse, elle pivote, elle gratte le métal rouillé. Un grincement aigu, une vibration qui remonte le long de son avant-bras et lui fait serrer les dents. La serrure résiste, elle gémit. Léna ferme les yeux, inspirant par le nez pour ne pas sentir l'odeur de la poussière et de la moisissure qui s'échappe de la porte. Elle pense à la maison. À la petite cuisine, aux carreaux de ciment blanc, au pot de café qui fume sur le poêle. À la radio qui diffuse des nouvelles ennuyeuses, à la voix de sa mère qui lui demande de ramasser le linge. À la routine. À la sécurité du quotidien. Ici, tout est faux. L'air est trop épais, la lumière trop faible, les ombres trop profondes.\n\nUn déclic sec. Le verrou cède.\n\nLéna retient son souffle. Elle ne pousse pas la porte immédiatement. Elle écoute. Le silence est lourd, presque liquide, comme de l'huile froide qui coule dans ses oreilles. Pas de pas, pas de souffle, pas de craquement de planche. Juste le vent qui hurle doucement au loin, traversant les dunes, sifflant entre les rochers. Elle pousse du bout des épaules. La porte s'ouvre avec une lenteur agonisante, émettant un soupir de bois fatigué qui s'étend sur plusieurs secondes. La lumière du jour, pâle et blafarde, entre dans le couloir sombre. Elle projette des ombres longues et déformées sur les murs tapissés de cartes marines jaunies et de photos encadrées dont les visages ont été rayés au couteau, ne laissant que des trous noirs et vides.\n\nLéna franchit le seuil. Le sol de la cabane est recouvert d'une fine couche de sable fin, mélangé à de la cendre grise. Elle avance pieds nus, la semelle de ses bottes restée accrochée à la porte. Le sable est froid sous la plante de ses pieds, il se déplace avec une fluidité inquiétante. Elle suit le couloir, les murs bas de l'entrée, jusqu'à la petite pièce principale. L'odeur frappe Léna avant même qu'elle ne voit le corps. Une odeur de sel séché, de poisson pourri et de fumée froide. C'est l'odeur de la mort qui a séjourné ici trop longtemps, qui s'est incrustée dans les murs, dans le bois, dans la peau de la maison.\n\nAu centre de la pièce, face à la fenêtre à barreaux qui donne sur la mer grise, se dresse le gardien.\n\nIl est assis dans son fauteuil de cuir noir, le tissu décousu laissant apparaître une mousse jaunie. Sa tête pend sur la poitrine, le menton écrasé contre le col de sa chemise blanche, tachée de noir. Il ne bouge pas. Il est figé dans une position qui n'est pas celle d'un homme endormi. Les mains sont posées sur les accoudoirs, les doigts recourbés comme des serres d'oiseau mort. Léna s'approche lentement. Chaque pas est un calcul. Elle doit savoir. Elle doit comprendre pourquoi ce silence. Pourquoi ce village se tait.\n\nElle s'arrête à trois mètres du fauteuil. Elle peut voir"},{"chapter":2,"prose":"La brume ne tombait pas, elle s'installait. Elle collait aux vitres de la cuisine de Ker-Morvan comme un film gras, rendant la lumière du matin indécise, grise et lointaine. Léna Marchetti essuya la vaisselle avec une serviette épongeuse, le geste mécanique de ceux qui cherchent à s'occuper les mains pour ne pas penser. L'air sentait le sel rassis, le café froid et cette odeur sucrée et lourde du chlore qui montait de la mer, même à des kilomètres du quai.\n\nElle éteignit le gaz. Le silence qui suivit ne fut pas un repos, mais une attente. Une inquiétude sourde, un bourdonnement à la base de la nuque, lui rappelait que quelque chose n'allait pas depuis trois jours. Le gardien du phare, ce vieux Henri, n'était pas revenu de son poste. Pas de coup de téléphone, pas de mot, pas de rumeur autre que celle, vague, qu'il avait fait une chute ou qu'il était ivre.\n\nLa porte s'ouvrit sans bruit. Yvon Squarcioni entra, l'eau gouttant de son imperméable beige sur le carrelage blanc. Il ne salua pas. Il avait les yeux cernés, le teint cendré d'un homme qui n'a pas dormi depuis deux nuits.\n\n— Ils ne veulent pas dire le nom, dit-il. La voix de Yvon était rauque, comme si la mer lui avait mangé la gorge.\n\n— Qui, Yvon ?\n\n— Le maire et le gendarme. Ils ont verrouillé la zone. Personne n'approche le phare. Pas même les marins pour ramasser les épaves.\n\nLéna posa l'assiette essuyée. Le bruit de la porcelaine contre le bois résonna trop fort. Elle sentit le poids de la peur monter, non pas en une vague de panique, mais en une lourdeur froide qui lui nouait l'estomac.\n\n— Et Gaspard ? demanda-t-elle.\n\n— Gaspard est à la mairie. Il dit que c'est un accident. Une tempête qui a emporté le garde-corps. Il dit que Henri a glissé. Mais personne ne croit ça. Personne ne veut croire ça.\n\nYvon s'approcha du tableau, fixant le croquis du phare qu'ils avaient fait ensemble il y a des années. Il ne le regardait pas, il le traversait du regard.\n\n— Garcia vient ce soir, annonça Yvon. Il a demandé à voir les archives du village. Il veut savoir qui avait un motif.\n\n— Garcia ? L'inspecteur ?\n\n— Oui. Il ne se contente pas des déclarations officielles. Il fouille.\n\nLéna sentit un frisson parcourir son échine. L'arrivée de Garcia changeait la donne. Cela transformait une tragédie locale en une enquête. Et si Henri n'avait pas glissé ? Si quelqu'un l'avait poussé ? Le silence du village n'était pas la pudeur d'un peuple face au malheur, c'était la complicité d'un peuple face à un crime.\n\nElle se tourna vers Yvon.\n\n— Pourquoi se taisent-ils, Yvon ? Pourquoi personne ne parle de Henri ?\n\nYvon soupira, un souffle court qui s'échappa de ses poumons comme une fuite d'air.\n\n— Parce que Henri savait. Ou parce qu'il a vu. Et que le village a décidé que ce silence était plus important que la vérité.\n\nIl sortit une cigarette de sa poche, la regarda un instant comme si elle était une arme, puis la remit. Il n'allumait pas, ici. Pas avec Léna.\n\n— Je dois y aller. Je vais vérifier les traces de pas. Si Garcia veut fouiller, il faudra qu'on lui montre quelque chose. Ou qu'on lui cache quelque chose.\n\n— Yvon, attends.\n\nIl se figea.\n\n— Quoi ?\n\n— Si tu vas au phare, tu ne peux pas y aller seul. Pas maintenant.\n\nLe vent, plus fort sur la pointe du phare que dans le village, fouettait le visage de Léna. L'air sentait le sel rance et la houille brûlée, une odeur âcre qui s'accrochait aux poumons et ne s'en allait plus. Elle serra son manteau autour d'elle, les manches trop longues lui masquant les mains. Yvon Squarcioni marchait devant elle, ses pas lourds s'enfonçant dans la terre battue, écrasant les miettes d'algues sèches. Il ne parlait pas. Il ne regardait pas en arrière. Léna suivait, le cœur battant à un rythme irrégulier, comme si elle attendait un coup qui ne viendrait jamais, mais qui pourrait frapper à tout instant.\n\nLe phare se dressait, masse de pierre grise et de fer rouillé contre un ciel de plomb. Les vitres de la lanterne étaient sales, opaques, comme des yeux malades. Léna sentit une gêne physique, une pression derrière les oreilles. Ce n'était pas la peur de la mort, c'était la peur de ce qui se cachait derrière les murs. Yvon s'arrêta devant la porte de bois épais, peinte en blanc écaillé. Il posa sa main dessus, paume ouverte, comme pour sentir la vibration de l'air.\n\n— Je vais monter, dit-il. La voix était rauque. Je dois voir si les traces mènent jusqu'ici. Si Garcia veut fouiller, il faudra qu'on lui montre quelque chose. Ou qu'on lui cache quelque chose.\n\n— Yvon, murmura Léna.\n\nIl se tourna, le visage durci par le vent.\n\n— Reste là. Ne touche à rien.\n\nIl poussa la porte. Elle grinça sur ses gonds rouillés, un son aigu qui coupa le bruit du vent pendant une seconde, puis fut étouffée par le lourd fracas de la fermeture. Léna resta sur le seuil, les yeux fixés sur le battant. Le silence qui suivit fut plus lourd que le bruit précédent. Elle entendit le crépitement de ses propres pas sur le gravier, le battement de son sang dans ses tempes. Elle recula de deux pas, se penchant pour examiner le sol.\n\nLes traces de pas étaient là, marquées dans la boue et le sable humide. Des semelles larges, profondes, venant de la direction du village. Mais il y avait autre chose. À côté de la trace principale, une marque plus fine, presque invisible, comme si quelqu'un avait traîé un objet léger. Léna s'accroupit, le froid de la terre lui mordant les genoux. Elle écarta la boue du pouce. La marque ressemblait à une éraflure, mais elle était trop régulière. Elle regarda autour d'elle, la tête penchée. Le vent lui fouettait les cheveux, lui collant des mèches au front.\n\n— Yvon ! cria-t-elle, la voix étouffée par le vent.\n\nAucune réponse. Juste le grincement lointain d'une porte intérieure qui s'ouvrait et se fermait. Elle se releva, les genoux craquant. Elle devait le rejoindre. Elle poussa la porte, l'air intérieur sentait la poussière, le vieux bois et une odeur métallique, comme du sang séché. L'obscurité était épaisse, seulement percée par les rares rayons de lumière qui filtraient par les fentes des volets.\n\nElle avança, le souffle court. L'odeur du gardien, Henri, était là, mais elle était différente. Pas celle de la mort, mais celle de la peur. Une sueur froide lui coula dans le dos. Elle entendit un bruit, un froissement, venant de l'étage supérieur. Elle monta les marches de bois, une à une, comptant mentalement. Dix, vingt, trente. Le bois grinçait sous son poids.\n\nAu premier étage, le couloir était sombre. Elle s'arrêta, la main tendue\n\nLa main de Léna tremblait contre la paroi froide. Le bois était rugueux, comme une peau malade. Elle ne vit rien, rien que l'ombre qui semblait boire la faible lumière du haut du phare. Un silence s'était abattu, plus lourd que le grondement de la mer dehors. Ce n'était pas un silence d'attente, mais celui de la retenue, de l'écoute. Elle poussa le loquet qui bloquait la porte de la chambre de veille, la serrure rouillée grinçant comme une plainte humaine.\n\nLa pièce était une caverne de livres et de cartons. Des piles de journaux, des atlas usés, des carnets de relevés météorologiques empilés jusqu'au plafond. L'air y était stagnant, saturé de l'odeur de la moisissure et de cette odeur métallique, âcre, qui n'avait pas quitté le bas. Mais cette fois, elle était plus nette. Une odeur de cuivre oxydé, de rouille fraîche. Léna fit un pas, ses bottes faisant un bruit sec sur le plancher.\n\n— Yvon ?\n\nSa voix se perdit dans l'amoncellement de papier. Pas de réponse. Seulement le sifflement du vent qui passait par les vitres épaisses, comme si la pierre elle-même respirait avec difficulté. Elle avança vers la table de travail, encombrée de cartes marines étalées, de compas, d'une boussole brisée. Sur la table, une tasse de café froid, une croûte de lait caillé au fond. Tout était en place, figé. Trop en place.\n\nElle se dirigea vers la fenêtre, cherchant une ouverture, une faille dans cette forteresse de solitude. Le vent était devenu plus violent, claquant contre les carreaux. Elle écarta les rideaux épais, poussant les lourdes épaisses de tissu. La lumière du jour, blafarde, s'invita dans la pièce, révélant la poussière qui dansait dans l'air.\n\n— C'est fou, murmura-t-elle. Personne ne vit ici depuis des années.\n\nElle tourna la tête vers le coin de la pièce, là où se trouvaient les tiroirs. Un tiroir était entrouvert. Un bruit de pas. Léna se figea. Le cœur battant à tout rompre, elle se figea, l'oreille tendue. Un bruit de pas, lourds, traînants, venant du corridor. Elle se recula, se fondant dans l'ombre derrière la pile de journaux.\n\n— Yvon ? appela-t-elle, la voix plus ferme cette fois.\n\nLe bruit s'arrêta. Puis un bruit de papier, un froissement sec. Quelqu'un fouillait dans les tiroirs. Léna se mit à genoux, cherchant un objet, n'importe quoi, un livre, une lampe. Elle saisit un lourd dictionnaire maritime, le serrant contre sa poitrine comme un bouclier. Elle attendit. Le silence s'étira, devenant une pression physique sur ses tempes.\n\n— Qui est là ? demanda-t-elle, sa voix brisée par la peur.\n\nUn rire, court, rauque, provenant du corridor. Pas celui de Yvon. Un rire sec, sans joie, comme celui d'un homme qui a oublié comment sourire.\n\n— Personne, dit une voix. Une voix de femme. Mais celle de Léna, la voix de la peur, la voix de la peur, la voix de la peur.\n\nLéna se leva, le dictionnaire toujours serré. Elle fit face à la porte. L'ombre s'agrandit, une silhouette qui se détachait contre la lumière grise de la fenêtre.\n\n— Léna ? La silhouette s'arrêta. C'était Yvon.\n\nElle haleta, un soulagement si violent qu'elle faillit tomber. Elle avait oublié le vent, la poussière, la peur. Yvon était là. Il était vivant.\n\n— Yvon ! s"},{"chapter":3,"prose":"La pluie ne tombait pas, elle s'accumulait. Elle collait aux vitres du bureau de Ker-Morvan comme une pellicule grasse, étouffant la lumière du crépuscule. À l'intérieur, l'air sentait le café froid et le bois humide. Léna Marchetti posa sa tasse sur le bureau en chêne usé. Le bruit du porcelaine contre le bois résonna dans le silence, trop fort pour le calme de la pièce. Elle fixa la lettre ouverte devant elle. Elle ne l'avait pas écrite. Elle ne l'avait jamais écrite.\n\nLe papier était épais, de couleur crème, avec une texture rugueuse qui grinçait sous ses doigts. L'encre était noire, trop noire, comme si elle avait été appliquée avec une rapidité nerveuse. Les caractères étaient serrés, penchés vers la droite. Elle ne reconnaissait pas l'écriture, mais la forme des mots était familière, comme un souvenir lointain qui refait surface sans visage.\n\nElle lut une seconde fois.\n\n*Le silence ne protège personne. La marée monte. Regarde derrière vous.*\n\nIl n'y avait pas de signature. Pas de date. Juste ces trois phrases. Léna sentit une contraction dans la poitrine, une chaleur froide qui remontait le long de sa colonne vertébrale. Elle se leva, fit le tour du bureau. La pièce était ordinaire. Des piles de dossiers, un téléphone filaire noir, un calendrier montrant la date d'hier. Rien ne semblait anormal, sauf la lettre. Elle la reprit. La sentit. Il y avait une odeur subtile, sous l'encre et la poussière. Du sel marin. Du goudron. L'odeur du phare.\n\nLa porte s'ouvrit avec un grincement. Léna se figea, la lettre toujours dans la main. Yvon Squarcioni entra. Il portait sa veste de pêche, trempée par la pluie. L'eau gouttait de ses cheveux gris sur le linoléum du couloir. Il n'avait pas l'air surpris de la voir. Il avait l'air fatigué, comme s'il portait le poids de toute la baie sur ses épaules.\n\n« Tu es encore là, » dit-il. Sa voix était rauque, usée par le tabac et le vent.\n\n« Je travaillais, » répondit Léna. Elle glissa la lettre dans sa poche intérieure, sous la chemise. Elle ne voulait pas qu'il la voie.\n\nYvon referma la porte. Il s'approcha du bureau, essuya la gouttière de son front avec le revers de la manche. Il ne regarda pas la lettre. Il regarda Léna, ses yeux gris cherchant quelque chose qu'il ne trouvait pas.\n\n« Il y a eu une nouvelle, » dit Yvon. « Garcia est arrivé ce matin. Il a demandé des nouvelles du gardien. »\n\n« Je sais, » répondit Léna. Elle croisa les bras. La tension dans la pièce était palpable, une pression qui montait avec la marée.\n\n« Il a l'air pressé, » poursuivit Yvon. « Il fouille partout. Il demande aux gens ce qu'ils ont vu la nuit du meurtre. Personne ne lui répond. »\n\n« Et toi, tu as répondu ? » demanda Léna.\n\nYvon haussa les épaules. « Je ne sais rien. Je ne vois rien. C'est comme ça qu'on survit ici. On ne voit rien. »\n\nIl y eut un long silence. La pluie battait contre la vitre avec une régularité hypnotique. Léna sentit la lettre brûler contre sa poitrine. Elle avait peur. Pas une peur vive, mais une inquiétude sourde qui s'installait dans le creux de l'estomac. Une certitude qu'elle ne voulait pas avouer : quelque chose allait mal. Quelque chose de grave.\n\nGarcia avait frappé à la porte de la mairie trois jours plus tôt. Il avait demandé à voir les archives du phare. Les\n\nLa pluie ne s'arrêtait pas. Elle frappait le carreau avec une persistance aveugle, transformant la rue en un ruban gris et brillant où les ombres des ormes s'étiraient et se déformaient sous le reflet des réverbères. Léna sentit la lettre brûler contre sa poitrine, à travers le tissu de son pull, une chaleur paradoxale dans ce froid qui remontait du sol. Elle ne bougeait pas. Yvon, lui, semblait avoir basculé dans une apathie protectrice, ses mains posées à plat sur la table en bois verni, comme s'il tenait par la force de son immobilité le monde entier en place.\n\n« Garcia a frappé à la porte de la mairie trois jours plus tôt. Il avait demandé à voir les archives du phare. » Léna continua la phrase d'Yvon, sa voix rauque à peine audible, comme si les mots lui brûlaient la gorge. Elle avait peur. Pas une peur vive, celle qui fait sursauter, mais une inquiétude sourde qui s'installait dans le creux de l'estomac, une certitude qu'elle ne voulait pas avouer : quelque chose allait mal. Quelque chose de grave.\n\nYvon ne releva pas la tête. « Les archives sont fermées. Ou plutôt, les tiroirs sont verrouillés. Le notaire a changé la serrure la semaine dernière. Il m'a dit que c'était une mesure de sécurité, après les rumeurs de cambriolage. Mais je sais qu'il ment. »\n\n« Tu sais pourquoi ? » demanda Gaspard, assis à l'autre bout de la table. Son regard était fixé sur la vitre, où la pluie dessina des sillons tortueux. Il ne semblait pas inquiet. Il semblait fatigué.\n\n« Parce que Garcia cherche quelque chose qui n'est pas dans les registres. » Yvon leva enfin les yeux. Son regard était vide, vidé de toute émotion, comme si la peur avait été extraite de lui depuis longtemps. « Le gardien ne s'est pas suicidé. Personne ici ne croit à cette histoire. Les gendarmes ont dit que c'était une histoire de chagrin, de dépression. Mais le gardien, lui, il ne buvait pas. Il ne parlait pas de chagrin. Il parlait de la mer. De ce qui venait du large. »\n\nGarcia avait frappé à la porte de la mairie. Il avait demandé à voir les archives du phare. Mais il ne s'agissait pas seulement de papiers. Léna sentit la lettre contre son cœur se tordre, comme une bête vivante. Elle avait lu les premières lignes de ce document, trouvé coincé dans la semelle de la vieille botte du gardien, la veille du meurtre. Une date. Un lieu. Un mot, inscrit d'une écriture tremblante : *L'Écho*.\n\n« Tu as dit que personne ne lui répondait, » reprit Léna, forçant sa voix à rester stable. « Mais toi, Yvon. Tu as répondu. »\n\nYvon haussa les épaules, un geste mécanique. « Je ne sais rien. Je ne vois rien. C'est comme ça qu'on survit ici. On ne voit rien. »\n\nLe silence s'étira, lourd, saturé de l'odeur de la pluie et de la poussière humide qui montait des murs. Léna ferma les yeux. Elle revit Garcia, la nuit précédente, dans la rue étroite. Il avait marché jusqu'à la mairie, son imperméable noir dégoulinant, ses yeux gris fixés sur l'entrée. Il n'avait pas frappé. Il avait simplement attendu. Comme un chien qui sent une proie. Puis, il était parti. Mais il avait laissé derrière lui une empreinte, une trace qu'elle n'avait pas encore vue.\n\n« Le gardien, » murmura Gaspard, brisant le silence. « Il a été vu la nuit du meurtre. Pas au phare. À la plage. Près de la cale. »\n\nLéna ouvrit\n\nLéna ouvrit les yeux. Le plafond de la salle des réunions était une carte de fissures, un réseau de cicatrices anciennes qui semblait bouger à la lueur vacillante des néons. L'odeur de la poussière humide s'était mêlée à celle du café froid, une senteur âcre qui collait au fond de la gorge. Gaspard avait raison. Le gardien n'avait pas été vu au phare. Il avait été vu là où il n'aurait jamais dû aller, à la plage, près de la cale.\n\n« À la cale ? » répéta Yvon Squarcioni, sa voix rauque se perdant dans le bourdonnement électrique. Il se gratta la nuque, laissant une traînée de suie sur sa peau pâle. « C'est une blague. Le gardien ne quitte jamais la tour. Il a les clés, il a les ordres. Il ne descend pas. »\n\n« Il a été vu, » insista Gaspard, posant une main lourde sur la table en chêne. Ses jointures étaient blanches. « Un pêcheur, hier soir. Il rentrait avec le filet. Il a vu une silhouette. Grande. Qui portait l'effigie du phare, mais qui se dirigeait vers la cale. Pas vers l'eau. Vers la vieille baraque des engins. »\n\nLéna sentit un froid lui parcourir l'échine, distinct de la fraîcheur ambiante. C'était l'odeur du poisson pourri qui montait des marées basses, mélangée à la peur. Elle se souvint de Garcia. Il avait attendu devant la mairie comme un chien, observant, analysant. Il n'avait pas besoin de frapper. Il savait que le village était une boîte de conserve scellée. Et aujourd'hui, Gaspard venait de dévisser le couvercle.\n\n« Qui a dit que c'était le gardien ? » demanda Yvon, mais sa voix tremblait légèrement. Il n'avait pas regardé Gaspard, il fixait la tache d'humidité sur le mur opposé. « C'était peut-être un touriste. Ou un voleur de bois. On ne connaît pas la plage, nous autres. On ne connaît rien. »\n\n« On sait que le gardien est mort, » coupa Léna, sa voix plus ferme qu'elle ne l'aurait voulu. Elle croisa les bras, cherchant une posture de défense, mais elle se sentait nue. « Et on sait que s'il était à la cale, il y avait une raison. »\n\nGaspard la dévisagea. Ses yeux, cernés par des nuits sans sommeil, semblèrent chercher quelque chose en elle, une faille, une complicité. « Tu as raison, Lena. Mais pourquoi personne ne l'a entendu ? Pourquoi personne n'a rien vu quand il est descendu ? »\n\nLe silence retomba, plus épais qu'avant. Il semblait peser sur leurs épaules, les obligeant à se courber. Dehors, la pluie reprenait, martelant la vitre avec une insistance rituelle, comme un doigt frappant une porte close. Léna ferma les yeux un instant, et revit la rue étroite, Garcia qui marchait, son imperméable noir dégoulinant. Il n'avait pas frappé. Il avait attendu. Et maintenant, il attendait toujours.\n\n« La cale, » murmura Yvon, comme s'il parlait pour lui-même. « Il y a des choses là-bas. Des choses qu'on ne devrait pas voir. »\n\n« Des choses ? » Gaspard se pencha en avant. « Tu parles de quoi, Yvon ? »\n\n« De la machine, » répondit l'homme sans lever la tête. Il commença à triturer un petit objet entre ses doigts : une clé rouillée, à peine plus grande qu'un ongle. Léna le vit briller sous la lumière, une étincelle grise dans la pénombre. « Le gardien ne descendait pas pour rien. Il venait vérifier. Il venait s'assurer que"},{"chapter":4,"prose":"Le brouillard ne s'était pas levé. Il avait seulement changé de texture, passant d'un voile humide à une brume plus dense, presque solide, qui collait aux vitres de la maison de Ker-Morvan comme une peau grasse. À l'intérieur, l'air sentait le sel séché et le bois pourri. Léna Marchetti se tenait debout dans la cuisine, les doigts entrelacés derrière son dos, observant la marmite de soupe qui frémissait à peine sur le feu électrique. Le bruit du gaz était un sifflement aigu, presque invisible, qui s'insinuait dans le silence de la maison.\n\nElle ne pouvait pas s'asseoir. Chaque fois qu'elle s'asseyait, elle sentait le poids de l'absence au fond de la salle à manger. Le gardien, cet homme dont on avait à peine entendu la voix, était parti, et le village avait décidé de le laisser partir sans un mot. Pas de fleurs sur la route, pas de cris dans la rue, pas de rumeurs. Juste ce silence, lourd comme un couvercle de fer.\n\nLa porte d'entrée s'ouvrit avec un grincement plaintif. Yvon Squarcioni entra, secouant son imperméable. L'eau tomba de ses épaules larges sur le carrelage en une traînée sombre. Il portait le visage fermé de ceux qui ont passé trop de temps à attendre la pluie.\n\n— Ils ne bougent pas, dit-il d'une voix rauque. Pas un seul voisin ne m'a ouvert la porte. On dirait que le village est mort avec lui.\n\nLéna tourna la tête, ses yeux suivant le mouvement de l'homme. Yvon était le type de personne que l'on voyait toujours, celui qui savait où étaient cachés les outils, qui connaissait les secrets de chaque famille. Mais aujourd'hui, il semblait petit, effacé par la masse du silence qui pesait sur la presqu'ule.\n\n— Ils ont peur, répondit Léna. Ou ils savent quelque chose.\n\n— La peur, c'est une excuse pour les lâches, marmonna Yvon en s'asseyant à la table. Il prit une cuillère et remua la soupe sans la goûter. Mais je ne sens pas la peur. Je sens une complicité. Une sorte de pacte.\n\nGarcia arriva quelques minutes plus tard, sans frapper, comme s'il avait été invité. Il portait un chapeau mou qu'il posa sur le rebord de la fenêtre, révélant un visage marqué par le sel et le temps. Ses yeux, d'un gris acier, balayèrent la pièce avant de se poser sur Léna. Il y avait une tension dans sa posture, une raideur dans les épaules qui n'était pas naturelle.\n\n— Gaspard est en route, annonça-t-il. Il a fait le tour de l'île. Il a trouvé des traces.\n\n— Des traces de quoi ? demanda Léna, le cœur se serrant dans sa poitrine.\n\n— De pas, dit Garcia. Pas de gardien. Des pas qui ne ressemblent à rien qu'on a l'habitude de voir.\n\nLe téléphone de la cuisine, un vieux modèle posé sur un chiffon, sonna. Le son était strident, violent dans la semi-silence de la pièce. Léna décrocha, le son de la voix de l'appelante lui coupant la respiration.\n\n— C'est le commissariat, dit-elle en raccrochant. Ils ont trouvé quelque chose. Quelque chose qui ne devrait pas être là.\n\nYvon leva les yeux, inquiet. — Qu'est-ce que c'est ?\n\n— Une lettre, dit Garcia en se rapprochant de la table. Une lettre trouvée dans la poche du veston du gardien. Mais elle n'a pas été écrite par lui.\n\nLéna sentit une vague de froid lui monter le long de la colonne vertébrale. Elle ne comprit pas tout de suite. Une lettre trouvée dans une poche, ce n'était pas un drame. Mais le ton de Garcia, le regard f\n\nLe froid ne venait pas du vent qui fouettait les vitres, mais de l'air même qui semblait s'être figé dans la cuisine. Garcia tenait le papier entre le pouce et l'index, comme si la matière brûlait sa peau. Léna observa ses jointures blanchir. La feuille était épaisse, de ce papier à lettre ancien qui sentait l'encre de chine et la poussière de bibliothèque, un contraste violent avec la saleté du veston du gardien.\n\n— Elle n'a pas été écrite par lui, répéta Garcia, la voix plus basse, presque un murmure.\n\nGaspard se pencha par-dessus l'épaule du commissaire. Il plissa les yeux, cherchant la signature, le timbre, tout ce qui pouvait trahir l'identité de l'auteur.\n— C'est une main ferme, dit-il enfin. Pas de tremblement. Le gardien avait les mains instables depuis l'accident, tu le sais. Il tremblait même en tenant sa tasse de café.\n\nLéna sentit un nœud se serrer dans son ventre. Elle s'appuya contre le plan de travail froid, le granit contre ses avant-bras.\n— Et ça ne ressemble pas à ça ? demanda-t-elle, désignant le gribouillis du mort qu'ils avaient vu sur la scène de crime.\n\n— Non, répondit Yvon Squarcioni. C'est net. Trop net.\n\nGarcia tourna la feuille. Il la tendit à Léna. Elle prit le papier, les doigts glacés. L'encre était noire, profonde. Les caractères étaient des majuscules d'imprimerie, sans aucune fioriture, sans aucune hésitation. Une écriture de soldat ou de prêtre, quelque chose d'absolument contrôlé.\n\n*« Ils ne savent pas encore que le silence a un prix. »*\n\nLes mots se détachèrent du fond blanc, tranchants comme des éclats de verre. Léna relut la phrase. Le sens lui échappait, mais la syntaxe, la froideur de la formulation, tout cela la perturbait. Ce n'était pas le langage d'un homme qui s'était battu pour sa vie dans la tour du phare. C'était le langage de quelqu'un qui surveillait, qui observait, et qui décidait.\n\n— Une fausse piste, murmura Garcia en reprenant la lettre. Ou une mise en scène.\n\n— Pourquoi faire ça ? demanda Léna. Pour effrayer ? Pour semer le doute ?\n\n— Pour dire qu'il n'est pas seul, répondit Gaspard. Si quelqu'un a écrit ça et l'a glissé dans la poche du mort, c'est que le tueur voulait qu'on la trouve. C'est un message.\n\n— Un message pour qui ?\n\n— Pour nous, dit Garcia en posant la lettre sur la table. Ou pour celui qui nous regarde.\n\nLe silence qui suivit fut lourd, étouffant. Le bruit de la pluie contre la vitre sembla soudainement s'intensifier, comme si la tempête extérieure cherchait à pénétrer l'enceinte du village. Yvon Squarcioni s'essuya le front du revers de la main. Ses yeux, habituellement vitreux, semblaient chercher une issue dans la pièce, une échappatoire à cette vérité qui s'imposait.\n\n— Le village se tait, dit soudain Yvon. C'est ça, le problème. On nous a dit que personne n'avait rien vu. Personne n'a entendu la chute. Personne n'a entendu les cris. Mais si cette lettre est là, alors quelqu'un a vu. Quelqu'un a agi.\n\n— Et si c'est un leurre ? lança Gaspard, nerveux. Pour nous faire croire qu'il y a un complice, alors qu'on n'a qu'un assassin solitaire ?\n\n— Non, dit Garcia avec une certitude qui tranche le doute. L'écriture ne ment pas. Et le papier... Il n'y a pas de papier comme ça dans ce village. Pas depuis des années. C'est un type de papier importé,\n\nLe papier semblait brûler les doigts de Garcia, une chaleur fantôme qui ne venait pas de la flamme de la bougie, mais de la gravité de l'objet lui-même. Il le tendit vers la lumière vacillante, laissant les lettres grises se détacher du fond blanc cassé. La texture était rude, granuleuse, un grain fin qui s'accrochait à la peau, opposé au papier lisse et brillant des factures ou des journaux que l'on trouvait aux bureaux de poste de Bonifacio.\n\n— Un papier importé, répéta Garcia, la voix plus basse, comme s'il parlait à l'ombre des murs. À Paris, à Marseille, peut-être. Pas ici. Ici, on écrit sur du kraft, sur des sacs de jute, sur le dos des vieux journaux quand la faim est trop grande pour attendre. Ce papier a un nom. Un nom qu'on ne trouve pas sur les étagères de la quincaillerie.\n\nGaspard s'agita sur sa chaise de bois, le bois grinçant sous son poids. La sueur perlait maintenant à sa tempe, coulant dans le sillon de son front, mélangeant la poussière de la cheminée à la peur.\n— Et alors ? Si c'est importé, ça veut dire quoi ? Que le gardien avait un ami à Paris ? Que le tueur est un voyageur ?\n— Ça veut dire que la mort a été préparée, répondit Garcia sans lever les yeux du document. Le gardien ne tuait pas les gens par accident, Gaspard. Et s'il y a une lettre, c'est qu'il y a eu une négociation. Une transaction.\n\nYvon Squarcioni, qui s'était assis à la table, les mains posées à plat sur le bois noirci par le temps, fit un mouvement brusque. Le son de ses ongles raclant la table fut aigu, perçant le silence lourd de la pièce.\n— Le village se tait, dit-il encore, comme une prière ou une malédiction. On nous a dit que personne n'avait rien vu. Personne n'a entendu la chute. Personne n'a entendu les cris. Mais si cette lettre est là, alors quelqu'un a vu. Quelqu'un a agi. Et ce quelqu'un a gardé le silence.\n\nLe silence n'était pas seulement l'absence de bruit extérieur ; il était une présence physique, un poids qui écrasait les poumons. La tempête dehors semblait s'être apaisée, remplacée par un vent plus sourd, plus glacial, qui s'engouffrait par les fissures du plancher, faisant danser les ombres sur les murs de pierre calcaire. L'odeur de la pluie et de la mer, mêlée à l'odeur âcre de la bougie et de la poussière, imprégnait l'air.\n\n— Peut-être que c'est un leurre, insista Gaspard, sa voix tremblante trahissant l'effort de rester rationnel. Pour nous faire croire qu'il y a un complice, alors qu'on n'a qu'un assassin solitaire. Quelqu'un qui a volé ce papier, qui l'a laissé là pour nous troubler.\n— Non, dit Garcia avec une certitude qui tranche le doute. L'écriture ne ment pas. Et le papier... Il n'y a pas de papier comme ça dans ce village. Pas depuis des années. C'est un type de papier importé, fabriqué à l'étranger, avec une encre qui résiste à l'humidité. Regardez les bords. Ils sont coupés au couteau, pas déchirés. C'est un geste précis. Un geste de quelqu'un qui veut qu'on le trouve, ou de quelqu'un qui veut qu'on ne le trouve pas.\n\nGarcia se leva, ses bottes lourdes crissant sur le sol de terre battue. Il s'approcha de la fenêtre, une fente étroite qui donnait sur le quai désert. Dehors, la nuit était si dense que les vagues semblaient"}],"knownCharacters":["Léna","Garcia","Gaspard","Yvon","Henri"],"seeds":["naufrage","dette","lettre","carnet","registre"],"candidates":[{"id":"canon-strict","prose":"La pluie ne tombait pas, elle s'insinuait. Une bruine froide, tenace, qui collait au visage comme un voile de suie et rendait le bitume de la corniche luisant de reflets grisâtres. Léna Marchetti garait sa berline sur le bas-côté, les essuie-glaces claquant d'un rythme mécanique, lents, comme s'ils hésitaient à faire leur travail. Elle coupa le contact. Le silence qui suivit n'était pas vide ; il était lourd, saturé de l'odeur de l'humidité et de la marée basse.\n\nElle sortit du véhicule. L'air sentait le varech mort et le goudron mouillé. Elle ajusta son manteau, un tissu lourd qui lui collait à la peau, et regarda vers le village. Saint-Cast-le-Gaulois s'étalait en contrebas, une rangée de toits d'ardoise sombre serrés les uns contre les autres, luisant sous la pluie. Les fenêtres étaient éteintes. Pas de lumière. Pas de mouvement. À cette heure, une heure du matin, la plupart des habitants dormaient, mais le village se s. Personne ne bouge.\n\nElle rentre. Elle ferme le volet. Le bruit du métal contre le bois est sec, violent. Elle éteint la lumière du salon. Elle s'assoit sur le canapé en cuir craquelé. Le cuir gémit sous son poids. Elle fixe la cheminée éteinte. La cendre est froide. Elle pense à son père. Elle pense à la dernière fois qu'elle l'a vu. Il était assis ici, exactement à la même place. Il avait les mêmes yeux, vides, fixés sur la cheminée. Il ne parlait pas. Il écoutait le vent.\n\nLéna se lève. Elle marche vers la porte d'entrée. Elle met son manteau. La laine est lourde, mouillée par la sueur froide de ses épaules. Elle ouvre la porte. Le vent entre, une vague d'air glacial qui chasse la chaleur résiduelle de la pièce. Elle ferme la porte derrière elle. Elle est dehors.\n\nLa rue est vide. Les pavés sont mouillés, reflétant la faible lueur des réverbères. Ils sont allumés, mais ils sont vieux. La lumière jaune tremble, vacille, puis s'éteint complètement dans un grésillement électrique. Léna ne bouge pas. Elle attend que la lumière revienne.","baseScore":581,"eligible":true},{"id":"synthese","prose":"Le sel colle à la peau comme une deuxième couche de poussière. Léna Marchetti sentit cette humidité pénétrer les coutures de son blouson avant même d'ouvrir la porte de la petite maison en pierre grise. L'air, dans la rue du Port, sentait l'algue séchée et le goudron, un mélange âcre qui s'incrustait au fond des poumons et ne partait jamais vraiment.\n\nElle poussa l'entrée. La porte grinça, un son long et rauque qui sembla résonner dans le silence de l'immeuble. À l'intérieur, l'odeur du café froid traînait encore, mêlée à celle de la fumée de cigarette. La table de la cuisine était jonchée de factures, de journaux froissés et d'une tasse renversée où le café avait séché en une croûte sombre.\n\nLéna posa son sac sur le plan de travail. Ses mouvements étaient précis, méthodiques. Elle avait appris, après des années à courir après les ombres, que le chaos commençait toujours par le désordre. Ici, rien n'était désordonné. C'était trop calme. Trop propre.\n\nElle alluma la cafetière. L'eau bouillit, un sifflement aigu qui coupa le silence. Elle s'appuya contre le mur, sentant la pierre froide traverser son dos. C'était son monde ordinaire, celui de Marseille, avant que tout ne bascule. Des ruelles où l'on se croise, des voisins qui se saluent, des enfants qui jouent devant les portes ouvertes. Une banalité rassurante. Mais depuis trois jours, cette banalité lui pesait sur les épaules comme un linceul humide.\n\nLa sonnerie du téléphone la fit sursauter. Elle décrocha sans regarder l'écran.\n\n« Allô ? »\n\n« C'est pour le dossier du phare de l'Est, Lena. » La voix du commissaire Dupin était grave, dépourvue de cette familiarité qu'il affichait habituellement. « Ils ont retrouvé le corps du gardien ce matin. »\n\nLéna ferma les yeux. Le silence qui suivit fut plus lourd que le bruit de la pluie qui commençait à tomber dehors.\n\n« Je suis au courant, dit-elle d'une voix neutre. Qui est-ce ? »\n\n« Un inconnu, Lena. Un homme d'une soixantaine d'années. Pas de papiers sur lui. Pas de traces d'effraction. Juste... mort, assis dans sa cabine. »\n\n« Assis ? »\n\n« Oui. Comme s'il avait attendu la mort. »\n\nLéna sentit un froid remonter le long de sa colonne vertébrale. « Et la famille ? »\n\n« La famille est au village. Ils refusent de parler. Ils disent qu'ils ne savent rien. Que le gardien vivait en ermite. »\n\n« Le gardien ne vivait pas en ermite, Dupin. Il parlait avec tout le monde. Il distribuait du poisson aux enfants. Il était connu. »\n\n« Alors ils mentent. Ou ils ont peur. »\n\nLéna posa la main sur la table, sentant le bois froid sous ses doigts. « Je pars. »\n\nElle raccrocha. La cafetière se tut, l'eau ayant coulé. Elle ne but pas son café. Elle s'habilla vite, enfilant un manteau noir, des bottes solides. Elle prit son sac à dos, y glissant un carnet, un stylo et une lampe torche.\n\nLa rue du Port était vide. Les voit E.addEventListener('input', ()=>{ clearTimeout(t); t = setTimeout(refreshGps, 600); });
refreshGps();
const knobsDiv = document.getElementById('knobs');
const settings = {};
for(const k of OMEGA_STUDIO.KNOB_IDS){
  const w = document.createElement('div'); w.className='knob';
  w.innerHTML = '<label>'+k+' <span id="v_'+k+'">0</span></label><input type="range" min="-100" max="100" value="0" id="k_'+k+'">';
  knobsDiv.appendChild(w);
  document.getElementById('k_'+k).addEventListener('input', (ev)=>{
    settings[k] = Number(ev.target.value)/100;
    document.getElementById('v_'+k).textContent = settings[k].toFixed(2);
    refreshMixer();
  });
}
function refreshMixer(){
  const r = OMEGA_STUDIO.remix(DATA.candidates, settings);
  const el = document.getElementById('ranking');
  if(r.error){ el.innerHTML = '<p>'+r.error+'</p>'; return; }
  el.innerHTML = '<table><tr><th>#</th><th>profil</th><th>base</th><th>ajusté</th><th>contributions</th></tr>'
    + r.ranked.map((c,i)=>'<tr class="'+(i===0?'winner':'')+'"><td>'+(i+1)+'</td><td>'+c.id+'</td><td>'+c.baseScore+'</td><td>'+c.adjustedScore+'</td><td>'+c.contributions.map(x=>x.knob+(x.delta>=0?'+':'')+x.delta.toFixed(1)).join(' ')+'</td></tr>').join('')
    + '</table><p style="color:#8b949e">changedWinner='+r.changedWinner+' · le gagnant reste un candidat ÉLIGIBLE (gates durs déjà passés)</p>';
}
refreshMixer();
</script></body></html>
